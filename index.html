  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #1A3A5C;
      --navy-light: #234d7a;
      --orange: #E65100;
      --orange-light: #F57C00;
      --bg: #F5F7FA;
      --white: #FFFFFF;
      --text: #1C2B3A;
      --text-muted: #5A6E82;
      --border: #D8E3EE;
      --shadow: 0 2px 16px rgba(26,58,92,0.10);
      --shadow-hover: 0 8px 32px rgba(26,58,92,0.18);
    }

    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }

    /* FAIXA */
    .emergency-bar {
      background: var(--orange);
      color: #fff;
      padding: 10px 16px;
      font-size: 0.82rem;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .emergency-bar span { opacity: 0.85; }
    .emergency-bar a {

      text-decoration: none;
      background: rgba(255,255,255,0.18);
