<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vox Cidadã – Rede de Proteção e Direitos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #1A3A5C;
      --navy-light: #234d7a;
      --orange: #E65100;
      --orange-light: #F57C00;
      --bg: #F5F7FA;
      --white: #FFFFFF;
      --text: #1C2B3A;
      --text-muted: #5A6E82;
      --border: #D8E3EE;
      --shadow: 0 2px 16px rgba(26,58,92,0.10);
      --shadow-hover: 0 8px 32px rgba(26,58,92,0.18);
    }

    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }

    /* FAIXA */
    .emergency-bar {
      background: var(--orange);
      color: #fff;
      padding: 10px 16px;
      font-size: 0.82rem;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .emergency-bar span { opacity: 0.85; }
    .emergency-bar a {
      color: #fff;
      text-decoration: none;
      background: rgba(255,255,255,0.18);
      border-radius: 6px;
      padding: 4px 12px;
      white-space: nowrap;
    }
    .emergency-bar a:hover { background: rgba(255,255,255,0.30); }

    /* HEADER */
    header {
      background: var(--navy);
      color: #fff;
      padding: 40px 24px 48px;
      text-align: center;
    }
    .logo-badge { display: inline-flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .logo-icon {
      width: 52px; height: 52px;
      background: rgba(255,255,255,0.12);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .site-title { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
    .site-title span { color: #7EC8E3; }
    .site-tagline { font-size: 1rem; color: rgba(255,255,255,0.72); max-width: 520px; margin: 0 auto; }

    /* MAIN */
    main { max-width: 1000px; margin: 0 auto; padding: 48px 24px 64px; }

    .section-label {
      font-size: 0.75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--text-muted); margin-bottom: 8px;
    }
    .section-title { font-size: 1.5rem; font-weight: 800; color: var(--navy); margin-bottom: 32px; }

    /* GRID — 3 colunas fixas em desktop */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-bottom: 64px;
      align-items: start;
    }

    .card {
      background: var(--white);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: var(--shadow);
      border: 1.5px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: box-shadow 0.25s, transform 0.25s;
    }
    .card:hover { box-shadow: var(--shadow-hover); transform: translateY(-3px); }

    .card-icon-wrap {
      width: 64px; height: 64px;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .card-icon-wrap svg { width: 34px; height: 34px; }
    .card--child .card-icon-wrap  { background: #E3F2FD; }
    .card--elder .card-icon-wrap  { background: #E8F5E9; }
    .card--animal .card-icon-wrap { background: #FFF3E0; }

    .card-title { font-size: 1.1rem; font-weight: 700; color: var(--navy); }
    .card-desc  { font-size: 0.88rem; color: var(--text-muted); line-height: 1.65; }

    .card-actions { display: flex; flex-direction: column; gap: 10px; }

    .btn {
      display: block;
      width: 100%;
      padding: 13px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
      border: none;
